$schema: 'https://moonrepo.dev/schemas/project.json'

# Next.js app: My week, timeline, dependency graph, run log, settings,
# Linear OAuth and webhooks. Workspace packages resolve through their built
# dist, so every task that runs Next depends on `^:build`.
language: 'typescript'
layer: 'application'

tasks:
  # Port 3000 in the main clone, shifted by the worktree offset elsewhere
  # (see scripts/README.md). run-dev.sh kills a stale server on the port.
  dev:
    script:
      'PORT=$(( ${WORKTREE_PORT_OFFSET:-0} + 3000 )) && bash
      ../../scripts/run-dev.sh "$PORT" -- next dev --port "$PORT"'
    deps:
      - '^:build'
    options:
      cache: false
      persistent: true
      runInCI: 'skip'
      envFile: '/.env.worktree'

  build:
    command: 'next build'
    deps:
      - '^:build'
    inputs:
      - 'app/**/*'
      - 'lib/**/*'
      - 'public/**/*'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'global.d.ts'
    outputs:
      - '.next'
    env:
      NEXT_TELEMETRY_DISABLED: '1'

  # Same port as dev (3000 + the worktree offset) unless PORT is set.
  start:
    script:
      'PORT="${PORT:-$(( ${WORKTREE_PORT_OFFSET:-0} + 3000 ))}" && next start
      --port "$PORT"'
    deps:
      - 'build'
    options:
      cache: false
      persistent: true
      runInCI: 'skip'
      envFile: '/.env.worktree'

  # Browser smoke test (Playwright, e2e/*.e2e.ts, playwright.config.ts): a
  # production build served by `next start` in demo mode on E2E_PORT
  # (default 3390 + the worktree offset). Needs a Chromium for Playwright
  # 1.56 (`playwright install chromium`, or PLAYWRIGHT_CHROMIUM_PATH /
  # PLAYWRIGHT_BROWSERS_PATH pointing at one). A `moon ci` target in
  # .github/workflows/ci.yml, which installs that Chromium first, so it runs
  # in CI whenever the planner or anything it depends on changed. moon ci
  # runs only the targets it is given, so the graph edge pulls it in nowhere
  # else.
  test-e2e:
    command: 'playwright test'
    deps:
      - 'build'
    inputs:
      - 'e2e/**/*'
      - 'playwright.config.ts'
    options:
      cache: false
      runInCI: true
      envFile: '/.env.worktree'

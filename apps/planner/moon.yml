$schema: 'https://moonrepo.dev/schemas/project.json'

# Next.js app: My week, timeline, dependency graph, run log, settings,
# Linear OAuth and webhooks. Workspace packages resolve through their built
# dist, so every task that runs Next depends on `^:build`.
language: 'typescript'
layer: 'application'

tasks:
  # Port 3000 in the main clone, shifted by the worktree offset elsewhere
  # (see scripts/README.md). run-dev.sh kills a stale server on the port.
  dev:
    script:
      'PORT=$(( ${WORKTREE_PORT_OFFSET:-0} + 3000 )) && bash
      ../../scripts/run-dev.sh "$PORT" -- next dev --port "$PORT"'
    deps:
      - '^:build'
    options:
      cache: false
      persistent: true
      runInCI: 'skip'
      envFile: '/.env.worktree'

  build:
    command: 'next build'
    deps:
      - '^:build'
    inputs:
      - 'app/**/*'
      - 'lib/**/*'
      - 'public/**/*'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'global.d.ts'
    outputs:
      - '.next'
    env:
      NEXT_TELEMETRY_DISABLED: '1'

  # Same port as dev (3000 + the worktree offset) unless PORT is set.
  start:
    script:
      'PORT="${PORT:-$(( ${WORKTREE_PORT_OFFSET:-0} + 3000 ))}" && next start
      --port "$PORT"'
    deps:
      - 'build'
    options:
      cache: false
      persistent: true
      runInCI: 'skip'
      envFile: '/.env.worktree'

  # Browser smoke test (Playwright, e2e/*.e2e.ts, playwright.config.ts): a
  # production build served by `next start` in demo mode on E2E_PORT
  # (default 3390 + the worktree offset). Needs a Chromium for Playwright
  # 1.56 (`playwright install chromium`, or PLAYWRIGHT_CHROMIUM_PATH /
  # PLAYWRIGHT_BROWSERS_PATH pointing at one). A `moon ci` target in
  # .github/workflows/ci.yml, which installs that Chromium first, so it runs
  # in CI whenever the planner or anything it depends on changed. moon ci
  # runs only the targets it is given, so the graph edge pulls it in nowhere
  # else.
  test-e2e:
    command: 'playwright test'
    deps:
      - 'build'
    inputs:
      - 'e2e/**/*'
      - 'playwright.config.ts'
    options:
      cache: false
      runInCI: true
      envFile: '/.env.worktree'

  # The api-key browser test (playwright.api-key.config.ts): the same
  # production build, served with LINEAR_AUTH=api_key against a loopback
  # fake of Linear (e2e/fake-linear-server.ts) on E2E_PORT and E2E_PORT+1
  # (default 3392 + the worktree offset), then a scan of everything the
  # server wrote (E2E_ARTIFACTS_DIR, a fresh temp dir by default) for the
  # test keys (e2e/scan-api-key-leaks.ts). A `moon ci` target like
  # test-e2e.
  test-e2e-api-key:
    script:
      'export E2E_ARTIFACTS_DIR="${E2E_ARTIFACTS_DIR:-$(mktemp -d)}" &&
      playwright test -c playwright.api-key.config.ts && bun
      e2e/scan-api-key-leaks.ts "$E2E_ARTIFACTS_DIR"'
    deps:
      - 'build'
    inputs:
      - 'e2e/**/*'
      - 'playwright.api-key.config.ts'
    options:
      cache: false
      runInCI: true
      envFile: '/.env.worktree'

  # The OAuth browser test (playwright.oauth.config.ts): the same
  # production build in OAuth mode, one browser holding Acme and Globex
  # sessions, against the loopback fake Linear through the test-only
  # LINEAR_API_URL (its own authorize page included) on E2E_PORT, E2E_PORT+1
  # and E2E_PORT+2 (a planner that admits only Acme; default 3394 + the
  # worktree offset), then a scan of everything both planners wrote
  # (E2E_ARTIFACTS_DIR, a fresh temp dir by default) for Linear tokens,
  # codes and the test secrets (e2e/scan-oauth-leaks.ts). A `moon ci`
  # target like test-e2e.
  test-e2e-oauth:
    script:
      'export E2E_ARTIFACTS_DIR="${E2E_ARTIFACTS_DIR:-$(mktemp -d)}" &&
      playwright test -c playwright.oauth.config.ts && bun
      e2e/scan-oauth-leaks.ts "$E2E_ARTIFACTS_DIR"'
    deps:
      - 'build'
    inputs:
      - 'e2e/**/*'
      - 'playwright.oauth.config.ts'
    options:
      cache: false
      runInCI: true
      envFile: '/.env.worktree'

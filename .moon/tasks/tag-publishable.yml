$schema: 'https://moonrepo.dev/schemas/tasks.json'

# Guard chain for packages published to npm. Each published package keeps a
# single npm lifecycle script, `"prepublishOnly": "moon run <name>:prepublish"`,
# which `pnpm publish` fires automatically; everything it runs is defined here.
#
# The chain stays `runInCI: 'skip'`: some guards fail by design outside a
# real publish, so no CI invocation may run them. CI's targeted `moon ci`
# never reaches them (it runs only its targets and their dependencies), but
# an untargeted `moon ci` runs every affected runInCI-enabled task, and
# 'skip' keeps the chain out of that too. Consequence: publishing from a
# CI-marked shell needs a `CI=` prefix, e.g. `CI= pnpm publish --dry-run`.
inheritedBy:
  tags: ['publishable']

tasks:
  # Publishes must use the pnpm version pinned in .prototools so lockfile and
  # package-manager behavior match CI. The script reads the pin itself.
  assert-pnpm-version:
    command: 'bun $workspaceRoot/scripts/assert-pnpm-version.ts'
    options:
      cache: false
      internal: true
      runInCI: 'skip'

  # Aggregator the prepublishOnly lifecycle hook points at. Projects append
  # extra guards via dep merge.
  prepublish:
    command: 'noop'
    deps:
      - 'assert-pnpm-version'
      - 'build'
    options:
      cache: false
      runInCI: 'skip'

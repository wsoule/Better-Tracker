name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege: CI only reads the repo. Jobs that need more must ask for
# it explicitly.
permissions:
  contents: read

# A new push to a PR supersedes its in-flight run; runs on main always
# finish so every commit there gets a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Plain-text-friendly logs: moon already disables colors and spinners when it
# detects CI. NO_COLOR keeps downloaded/raw logs byte-clean for humans and
# agents; GitHub workflow commands (::error test annotations) are unaffected.
env:
  NO_COLOR: 1

jobs:
  # One affected-aware lane: moon computes the affected projects from the VCS
  # diff (PR base, or the push range on main), expands through graph
  # relations (a package change re-runs its dependents' builds, tests, and
  # typechecks), and restores unchanged work from the moon cache.
  ci:
    name: Build, test, lint
    runs-on: ubuntu-latest
    # A real Postgres so the store's node-postgres suites (row and advisory
    # locks, isolation levels, the concurrent-migration race) run in CI, not
    # only the PGlite ones. Production uses node-postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Read only by the store test suites (see packages/store/test).
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/planner_test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # moon diffs against the merge base to compute affected projects.
          fetch-depth: 0

      - name: Set up moon and caches
        uses: ./.github/actions/setup

      - name: Run format
        run: >-
          moon run root:format-check

      # planner:test-e2e (a target below) drives Playwright's Chromium, so
      # it is installed before moon runs: from the planner's own Playwright
      # (the catalog pin), with its OS libraries, the download cached per
      # Playwright version. moon's own install step then finds the
      # dependencies up to date.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: >-
          echo "version=$(node -p
          "require('./apps/planner/node_modules/@playwright/test/package.json').version")"
          >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key:
            ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
          path: ~/.cache/ms-playwright

      - name: Install Playwright Chromium
        run:
          pnpm --dir apps/planner exec playwright install --with-deps chromium

      # moon ci runs exactly the targets it is given, each only when it is
      # affected (or runInCI: 'always'), plus their dependencies; it never
      # adds a task that is not a target or a dependency of one, whatever its
      # runInCI. A target whose task is runInCI: 'skip' is dropped. Without
      # targets moon ci would run every affected runInCI-enabled task and
      # every 'always' one (root:clean-all included), so CI always names
      # them. --include-relations with --downstream deep makes a package
      # change affect the tasks of every project that depends on it, directly
      # or not (without deep, a store change reached engine but not worker or
      # planner); packages/ui's noop build carries ui changes to the planner.
      # --summary detailed appends an end-of-log recap naming every action
      # with status, duration, and cache hash, so a failed target is readable
      # from the log tail without scrolling through interleaved task output.
      - name: Run affected tasks
        run: >-
          moon ci --include-relations --downstream deep --summary detailed
          :build :test :typecheck ui:typecheck-host planner:test-e2e
          planner:test-e2e-api-key root:lint root:lint-css

      # Playwright keeps a trace of each failed e2e test (trace:
      # retain-on-failure); open it with `playwright show-trace`.
      - name: Upload e2e traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planner-e2e-traces
          path: apps/planner/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The Railway image (deploy/Dockerfile, both services) builds, and both
  # services start from it in demo mode: the web app answers /api/health and
  # the worker's tick runs. moon does not see this path (the image builds
  # with scripts/build-all.sh and starts outside the workspace tooling).
  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build --file deploy/Dockerfile --tag planner:ci .

      - name: Start the web service
        run: |
          docker run --detach --name web --publish 3000:3000 \
            --env LINEAR_FIXTURE=1 planner:ci
          for _ in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs web
          exit 1

      - name: Run the worker tick
        run: >-
          docker run --rm --env LINEAR_FIXTURE=1 planner:ci node
          apps/worker/dist/index.js tick

  actions-pinned:
    name: Actions pinned to SHA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify external actions are pinned to a full commit SHA
        run: |
          # Supply-chain guard: every external action must be pinned to a
          # 40-character commit SHA, never a movable tag/branch. Local actions
          # (uses: ./...) ship with the repo and are exempt. Scans the workflows
          # and the shared composite action manifest alike.
          set -euo pipefail
          unpinned=$(
            grep -rEn '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[^.[:space:]]' .github \
              | grep -vE 'uses:[[:space:]]*[^[:space:]]+@[0-9a-fA-F]{40}([[:space:]]|#|"|'"'"'|$)' \
              || true
          )
          if [ -n "$unpinned" ]; then
            echo "::error::These actions are not pinned to a full commit SHA:"
            echo "$unpinned"
            echo "Pin each to a 40-character commit SHA, e.g. owner/repo@<sha> # vX.Y.Z"
            exit 1
          fi
          echo "All external actions are pinned to a full commit SHA."

name: Image

# Publishes the deploy image (deploy/Dockerfile) to the GitHub Container
# Registry on every push to main, as ghcr.io/<owner>/better-tracker:main plus
# an immutable sha-<short> tag. A Railway service can then run the image
# directly when it cannot build from the repository itself (for example when
# its GitHub App cannot see the repo). The image needs no build-time secrets;
# every service gets its configuration from runtime variables.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# packages: write lets GITHUB_TOKEN push to this repository's GHCR packages.
permissions:
  contents: read
  packages: write

# A newer push supersedes an in-flight publish of the same branch.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_COLOR: 1

jobs:
  publish:
    name: Publish the deploy image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Plain docker CLI on the runner, so no third-party action needs pinning.
      # The source label links the package to this repository on GHCR.
      - name: Build and push to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/better-tracker"
          short="${GITHUB_SHA::7}"
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker build --file deploy/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:main" --tag "$image:sha-$short" .
          docker push "$image:main"
          docker push "$image:sha-$short"
          echo "Pushed $image:main and $image:sha-$short" >> "$GITHUB_STEP_SUMMARY"
